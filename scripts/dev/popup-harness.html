<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Prévisualisation du vrai popup hors extension. Servir la racine du projet,
         puis ouvrir /scripts/dev/popup-harness.html?state=live|offline|empty|many|loading
         &theme=light&lang=en&tab=menu|history&panel=data&next=1&sheet=1&query=lu
         &plus=1 (licence active) &plusview=1 (écran StreamPulse+) &scrollto=<id> -->
    <base href="/html/" />
    <title>StreamPulse · banc du popup</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/popup.css" />
    <script>
      // &pseudo=1&lang=en : la pseudo-langue (npm run i18n:pseudo) remplace
      // l'anglais. L'import map doit exister avant le premier module chargé.
      if (new URLSearchParams(location.search).get("pseudo") === "1") {
        const map = document.createElement("script");
        map.type = "importmap";
        map.textContent = JSON.stringify({ imports: { "/i18n/lang/en.js": "/localization/.cache/pseudo/en-XA.js" } });
        document.currentScript.after(map);
      }
    </script>
    <script src="/scripts/dev/mock-chrome.js"></script>
  </head>
  <body data-theme="dark">
    <script type="module">
      const params = new URLSearchParams(location.search);
      const source = await (await fetch("/html/popup.html")).text();
      const parsed = new DOMParser().parseFromString(source, "text/html");
      parsed.querySelectorAll("script").forEach((node) => node.remove());
      // Feuilles de style du vrai popup absentes d'ici (fx-effects.css…) : reprises telles quelles.
      const loaded = new Set([...document.querySelectorAll('link[rel="stylesheet"]')].map((link) => link.getAttribute("href")));
      parsed.head.querySelectorAll('link[rel="stylesheet"]').forEach((link) => {
        if (!loaded.has(link.getAttribute("href"))) document.head.append(link.cloneNode());
      });
      document.body.innerHTML = parsed.body.innerHTML;

      await import("/js/popup.js");
      document.dispatchEvent(new Event("DOMContentLoaded"));

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      // popup.js wires its buttons after an async storage read: let it finish.
      await wait(900);

      for (let i = 0; i < Number(params.get("next") || 0); i++) document.getElementById("stage-next")?.click();
      if (params.get("tab") === "menu") document.getElementById("tab-settings")?.click();
      if (params.get("tab") === "history") document.getElementById("tab-history")?.click();
      if (params.get("plusview") === "1") document.getElementById("open-plus")?.click();
      const panel = params.get("panel");
      if (panel) document.querySelector(`.menu-tab[data-panel="${panel}"]`)?.click();
      if (params.get("sheet")) document.getElementById("open-all-channels")?.click();
      const scrollTo = params.get("scrollto");
      if (scrollTo) document.getElementById(scrollTo)?.scrollIntoView({ block: "start" });
      const query = params.get("query");
      if (query) {
        const search = document.getElementById("sheet-search");
        search.value = query;
        search.dispatchEvent(new Event("input"));
      }

      await wait(400);
      if (params.get("pseudo") === "1") reportUnlocalized();
      document.documentElement.dataset.ready = "1";

      /**
       * En pseudo-langue, tout texte traduit est encadré de ［ ］. Un texte
       * visible sans crochet ne passe pas par l'i18n : on le liste.
       */
      function reportUnlocalized() {
        const visible = (node) => {
          const el = node.nodeType === 1 ? node : node.parentElement;
          return el && el.closest("script, style, [hidden], [aria-hidden='true']") === null && el.getClientRects().length > 0;
        };
        const found = [];
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        for (let node = walker.nextNode(); node; node = walker.nextNode()) {
          const text = node.textContent.trim();
          if (/\p{L}{2,}/u.test(text) && !text.includes("［") && visible(node)) found.push(text.slice(0, 60));
        }
        for (const el of document.querySelectorAll("[title], [placeholder], [aria-label]")) {
          for (const attr of ["title", "placeholder", "aria-label"]) {
            const value = el.getAttribute(attr);
            if (value && /\p{L}{2,}/u.test(value) && !value.includes("［") && visible(el)) found.push(`${attr}="${value.slice(0, 50)}"`);
          }
        }
        window.__pseudoReport = [...new Set(found)];
        console.warn(`[i18n] ${window.__pseudoReport.length} texte(s) visible(s) hors i18n`, window.__pseudoReport);
      }
    </script>
  </body>
</html>
